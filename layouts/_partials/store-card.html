<a href="{{ .Permalink }}" class="coupon-card block hover:scale-105 transition-transform">
    <div class="p-6">
    <div class="w-20 h-20 mx-auto mb-4 bg-white rounded-lg shadow flex items-center justify-center">
    {{ if .Params.logo }}
    <img src="{{ .Params.logo }}" alt="{{ .Title }}" class="max-w-full max-h-full p-2">
    {{ else }}
    <div class="text-3xl font-bold text-primary-600">{{ substr .Title 0 1 }}</div>
    {{ end }}
    </div>
    <h3 class="text-lg font-semibold text-center mb-2">{{ .Title }}</h3>
    <p class="text-sm text-gray-600 text-center mb-3">{{ .Params.coupon_count | default "0" }} Coupons</p>
    <div class="text-center">
    <span class="text-primary-600 font-medium text-sm">View Deals →</span>
    </div>
    </div>
    </a>
