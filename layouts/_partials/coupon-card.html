<div class="coupon-card" data-coupon-id="{{ .id }}">
    <div class="p-6">
    <div class="flex justify-between items-start mb-4">
    <div class="flex-1">
    <h3 class="text-xl font-semibold mb-2 text-gray-900">{{ .title }}</h3>
    <p class="text-gray-600 text-sm">{{ .description }}</p>
    </div>
    <span class="bg-green-100 text-green-800 text-xs font-semibold px-3 py-1 rounded-full">{{ .discount }}</span>
    </div>
    <div class="bg-gray-50 rounded-lg p-4 mb-4 border-2 border-dashed border-gray-300">
    <div class="flex items-center justify-between">
    <code class="text-lg font-mono font-bold text-primary-600">{{ .code }}</code>
    <button onclick="copyCoupon('{{ .code }}')" class="bg-primary-600 hover:bg-primary-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors">Copy Code</button>
    </div>
    </div>
    <div class="flex items-center justify-between text-sm text-gray-500">
    <span>Used {{ .used_count }} times</span>
    <span>Expires: {{ .expires_at }}</span>
    </div>
    </div>
    </div>
