baseURL      = "https://www.couponhauls.com/"
languageCode = "en-us"
title        = "CouponHauls.com - Best Coupon Code, Deals"

# Disable taxonomy & term pages (no /tags/ or /categories/ pages needed)
disableKinds = ["taxonomy", "term"]

# ─────────────────────────────────────────────────────────────────────────────
# Permalink rewrite:  /stores/<slug>/  →  /<slug>/
# Each store lives at amazon.couponhauls.com (not /stores/amazon/)
# Store .md files stay in content/stores/ but URLs are flattened here.
# On your CDN/host (Netlify, Cloudflare, etc.) you need wildcard subdomain
# routing pointing to the same build output. See README for details.
# ─────────────────────────────────────────────────────────────────────────────

[permalinks]
  stores = "/:slug/"

[params]
  description    = "Find the best coupon codes, promo codes, and deals from top stores. Save money on your online shopping with CouponHauls."
  author         = "CouponHauls"
  og_image       = "images/couponhaulslogo.jpg"
  twitter_handle = "@couponhauls"

[menu]
[[menu.main]]
  name   = "Stores"
  url    = "/stores/"
  weight = 1
[[menu.main]]
  name   = "Blog"
  url    = "/blog/"
  weight = 2

[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true