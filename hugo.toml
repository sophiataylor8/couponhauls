baseURL      = "https://www.couponhauls.com/"
locale       = "en-US"
title        = "CouponHauls.com"
disableHugoGeneratorInject = true

enableRobotsTXT = false
enableGitInfo   = false
canonifyURLs    = false
relativeURLs    = false

disableKinds = ["taxonomy", "term"]

[permalinks]
  stores = "/:slug/"

[params]
  description    = "Find the best coupon codes, promo codes, and deals from top stores. Save money on your online shopping with CouponHauls."
  author         = "CouponHauls"
  og_image       = "images/couponhaulslogo.png"
  twitter_handle = "@couponhauls_com"

[menu]
[[menu.main]]
  name   = "Stores"
  url    = "/stores/"
  weight = 1
[[menu.main]]
  name   = "Blog"
  url    = "/blog/"
  weight = 2

[outputs]
  home    = ["HTML", "Sitemap", "StoreSearchData"]
  section = ["HTML"]
  page    = ["HTML"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[build]
  writeStats = true

[minify]
  disableHTML  = false
  disableCSS   = false
  disableJS    = false
  disableJSON  = false
  disableSVG   = false
  disableXML   = false
  minifyOutput = true
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepWhitespace       = false
      keepDefaultAttrVals  = false

[sitemap]
  changefreq = "weekly"
  priority   = 0.8

[caches]  
  [caches.images]
    maxAge = "720h"

[mediaTypes]
  [mediaTypes."application/xml"]
    suffixes = ["xml"]
  [mediaTypes."application/json"]
    suffixes = ["json"]

[outputFormats]
  [outputFormats.Sitemap]
    mediaType      = "application/xml"
    baseName       = "sitemap"
    isPlainText    = true
    notAlternative = true
    rel            = "sitemap"
  [outputFormats.StoreSearchData]
    mediaType      = "application/json"
    baseName       = "stores-search-data"
    isPlainText    = true
    notAlternative = true

[security]
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

[security.node.permissions]
allowRead = ["."]
allowAddons = ["tailwindcss"]
allowChildProcess = ["tailwindcss"]
allowWorker = ["tailwindcss"]