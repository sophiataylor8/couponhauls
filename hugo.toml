baseURL      = "https://www.couponhauls.com/"
languageCode = "en-us"
title        = "CouponHauls.com - Best Coupon Code, Deals"

enableRobotsTXT = true
enableGitInfo   = false
canonifyURLs    = false
relativeURLs    = false

disableKinds = ["taxonomy", "term"]

[permalinks]
  stores = "/:slug/"

[params]
  description    = "Find the best coupon codes, promo codes, and deals from top stores. Save money on your online shopping with CouponHauls."
  author         = "CouponHauls"
  og_image       = "images/couponhaulslogo.png"
  twitter_handle = "@couponhauls"

[menu]
[[menu.main]]
  name   = "Stores"
  url    = "/stores/"
  weight = 1
[[menu.main]]
  name   = "Blog"
  url    = "/blog/"
  weight = 2

[outputs]
  home    = ["HTML", "RSS", "Sitemap"]
  section = ["HTML"]
  page    = ["HTML"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[build]
  writeStats = true

[minify]
  disableHTML  = true
  disableCSS   = false
  disableJS    = false
  disableJSON  = false
  disableSVG   = false
  disableXML   = false
  minifyOutput = true

[sitemap]
  changefreq = "weekly"
  priority   = 0.8

[mediaTypes]
  [mediaTypes."application/xml"]
    suffixes = ["xml"]

[outputFormats]
  [outputFormats.Sitemap]
    mediaType      = "application/xml"
    baseName       = "sitemap"
    isPlainText    = true
    notAlternative = true
    rel            = "sitemap"